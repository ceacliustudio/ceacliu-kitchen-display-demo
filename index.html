<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kitchen Display demo · Ceacliu Studios</title>
<meta name="description" content="Interactive demo of Ceacliu Kitchen Display, a kitchen order board for WooCommerce. Lite and Full editions.">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#f4f7fb;color:#172537}
.page{max-width:1200px;margin:0 auto;padding:28px 20px 48px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.brand{font-size:13px;font-weight:700;color:#1d6b52;letter-spacing:.02em}
.intro h1{font-size:clamp(34px,6vw,60px);margin:8px 0 10px;line-height:1.05}
.intro p{margin:0;color:#40536b;max-width:640px;line-height:1.5}
.seg{display:inline-flex;gap:6px;margin-top:16px}
.seg button,.demo-bar button{font:inherit;font-size:15px;border:1px solid #254261;background:#fff;color:#183957;border-radius:6px;padding:8px 14px;min-height:40px;cursor:pointer}
.seg button[aria-pressed=true]{background:#183957;color:#fff}
.demo-bar{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 0;padding-top:16px;border-top:1px solid #d5dee8}
.demo-bar .primary{background:#1d6b52;border-color:#1d6b52;color:#fff}
.hint{font-size:13px;color:#40536b;margin:8px 0 0}
.lang button{font-size:14px;min-height:34px;padding:5px 12px}
.ck{margin-top:6px}
.ck-header h1{display:none}
.ck-header{justify-content:flex-end;margin-bottom:6px}
#ck-status{font-size:13px;color:#40536b;margin:6px 0 10px}
footer{margin-top:28px;font-size:13px;color:#40536b}
footer a{color:#183957}
.ck { color: #172537; margin-block: 24px; }
.ck-header { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.ck-header h1 { font-size: clamp(28px, 4vw, 44px); font-weight: 700; line-height: 1.15; }
.ck-controls { display: flex; gap: 8px; flex-wrap: wrap; }
.ck-board { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.ck-board.ck-history { grid-template-columns: minmax(0, 1fr); }
.ck-column { background: #e7edf4; border-top: 5px solid #526981; padding: 12px; border-radius: 10px; min-width: 0; }
.ck-new { border-color: #2266af; }
.ck-preparing { border-color: #9b5c14; }
.ck-ready { border-color: #267257; }
.ck-column h2 { margin: 0 0 12px; font-size: 19px; }
.ck-ticket { background: #fff; border-radius: 8px; margin-bottom: 10px; padding: 14px; box-shadow: 0 1px 3px #17253724; overflow-wrap: anywhere; }
.ck-ticket-heading { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.ck-ticket h3 { margin: 0; font-size: 18px; }
.ck-time, .ck-empty { color: #40536b; }
.ck-items { list-style: none; padding: 0; margin: 0; }
.ck-item { font-size: 16px; line-height: 1.35; margin-bottom: 9px; }
.ck-option { font-size: 14px; color: #354760; margin: 3px 0 0 12px; white-space: pre-line; }
.ck-note { border-left: 3px solid #cc811c; padding: 8px; margin: 10px 0; background: #fff3df; font-size: 15px; white-space: pre-wrap; }
.ck-timer { font-variant-numeric: tabular-nums; font-weight: 600; }
.ck .ck-button, .ck .ck-select { font: inherit; border-radius: 6px; padding: 8px 12px; min-height: 44px; }
.ck-button { border: 1px solid #254261; background: #fff; color: #183957; cursor: pointer; }
.ck-action { width: 100%; margin-top: 6px; background: #183957; color: #fff; }
.ck-button:disabled { opacity: .52; cursor: default; }
.ck-error { color: #a52923; font-weight: 700; }
@media (max-width: 780px) {
	.ck-board { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 535px) {
	.ck-board { grid-template-columns: minmax(0, 1fr); }
}

.ck:fullscreen { overflow: auto; background: #f4f7fb; padding: 18px; margin: 0; }
</style>
</head>
<body>
<div class="page">
	<div class="top">
		<div class="intro">
			<div class="brand">Ceacliu Studios</div>
			<h1 data-t="title"></h1>
			<p data-t="lead"></p>
			<div class="seg" role="group" aria-label="Edition">
				<button type="button" data-mode="lite">Lite</button>
				<button type="button" data-mode="full">Full</button>
			</div>
			<p class="hint" data-t-mode></p>
		</div>
		<div class="seg lang" role="group" aria-label="Language">
			<button type="button" data-lang="en">English</button>
			<button type="button" data-lang="ro">Română</button>
		</div>
	</div>
	<div class="demo-bar">
		<button type="button" class="primary" id="demo-add" data-t="add"></button>
		<button type="button" id="demo-reset" data-t="reset"></button>
	</div>
	<div class="wrap ck" id="ceacliu-kitchen">
		<header class="ck-header"><h1>Kitchen Display</h1><div id="ck-controls" class="ck-controls"></div></header>
		<p id="ck-status" role="status"></p>
		<div id="ck-board" class="ck-board" aria-busy="true"></div>
	</div>
	<footer data-t="footer"></footer>
</div>
<script>
(function () {
	var m = (location.hash || '').replace('#', '').split('-');
	var mode = m[0] === 'lite' ? 'lite' : 'full';
	var lang = m[1] === 'ro' ? 'ro' : 'en';
	document.documentElement.lang = lang;
	window.CK_DEMO = { mode: mode, lang: lang };

	var T = {
		en: {
			title: 'Kitchen Display',
			lead: 'See how WooCommerce orders reach the kitchen tablet. Tap the buttons on the tickets to move them from New to Preparing to Ready. All orders here are fictional.',
			lite: 'Lite: live board with New, Preparing and Ready, product options, customer notes and full screen. Free on WordPress.org.',
			full: 'Full: everything in Lite, plus station views (Pizza, Kitchen, Bar), sound alerts for new orders, preparation timers and a 7-day ready history.',
			add: 'Simulate an order', reset: 'Reset demo',
			footer: 'Demo with fictional orders. In WordPress the board reads WooCommerce orders in Processing; kitchen statuses never change the order, the payment or customer e-mails. Made by Ceacliu Studios.',
			labels: { fullscreen: 'Full screen', exitFull: 'Exit full screen', 'new': 'New', preparing: 'Preparing', ready: 'Ready', start: 'Start preparing', finish: 'Mark ready', order: 'Order', empty: 'No orders here.', connected: 'Last updated', error: 'Connection interrupted. Check WooCommerce before preparing an order.', expired: 'Session expired. Reload this page and sign in again if prompted.', conflict: 'The order changed. The board has been refreshed.', saveError: 'Could not update this order.', all: 'All stations', station: 'Station', history: 'Ready history (7 days)', live: 'Live board', soundOn: 'Enable sound', soundOff: 'Mute sound', elapsed: 'Prep time' },
			stations: { pizza: 'Pizza', kitchen: 'Kitchen', bar: 'Bar' },
			p: { diavola: 'Pizza Diavola', margherita: 'Pizza Margherita', quattro: 'Pizza Quattro Formaggi', caesar: 'Caesar salad', lasagna: 'Lasagna', fries: 'French fries', cola: 'Cola 0.5 l', lemonade: 'Lemonade', tiramisu: 'Tiramisu' },
			o: { size: 'Size', extra: 'Extra toppings', sauce: 'Sauce', dressing: 'Dressing', remarks: 'Remarks' },
			v: { s32: '32 cm', s42: '42 cm', mush: 'Mushrooms', olives: 'Olives', ham: 'Ham', garlic: 'Garlic', spicy: 'Spicy', side: 'On the side', crispy: 'Extra crispy', ice: 'No ice' },
			notes: ['No onions, please.', 'Allergy: no nuts, please.', '', 'Cut the pizza into 8 slices.', '']
		},
		ro: {
			title: 'Ecran bucătărie',
			lead: 'Vezi cum ajung comenzile WooCommerce pe tableta din bucătărie. Apasă butoanele de pe bonuri ca să le muți din Noi în În preparare și apoi în Gata. Comenzile de aici sunt fictive.',
			lite: 'Lite: panou live cu Noi, În preparare și Gata, opțiunile produselor, observațiile clientului și ecran complet. Gratuit pe WordPress.org.',
			full: 'Full: tot ce are Lite, plus stații separate (Pizza, Bucătărie, Bar), sunet la comenzi noi, cronometru de preparare și istoricul comenzilor gata pe 7 zile.',
			add: 'Simulează o comandă', reset: 'Resetează demo-ul',
			footer: 'Demo cu comenzi fictive. În WordPress, panoul citește comenzile WooCommerce în procesare; stările din bucătărie nu schimbă comanda, plata sau e-mailurile clientului. Realizat de Ceacliu Studios.',
			labels: { fullscreen: 'Ecran complet', exitFull: 'Ieși din ecran complet', 'new': 'Noi', preparing: 'În preparare', ready: 'Gata', start: 'Începe prepararea', finish: 'Marchează gata', order: 'Comanda', empty: 'Nu sunt comenzi aici.', connected: 'Ultima actualizare', error: 'Conexiune întreruptă. Verifică WooCommerce înainte să pregătești o comandă.', expired: 'Sesiunea a expirat. Reîncarcă pagina și autentifică-te din nou dacă ți se cere.', conflict: 'Comanda s-a schimbat. Panoul a fost actualizat.', saveError: 'Comanda nu a putut fi actualizată.', all: 'Toate stațiile', station: 'Stație', history: 'Istoric comenzi gata (7 zile)', live: 'Panou live', soundOn: 'Activează sunetul', soundOff: 'Oprește sunetul', elapsed: 'Timp de preparare' },
			stations: { pizza: 'Pizza', kitchen: 'Bucătărie', bar: 'Bar' },
			p: { diavola: 'Pizza Diavola', margherita: 'Pizza Margherita', quattro: 'Pizza Quattro Formaggi', caesar: 'Salată Caesar', lasagna: 'Lasagna', fries: 'Cartofi prăjiți', cola: 'Cola 0,5 l', lemonade: 'Limonadă', tiramisu: 'Tiramisu' },
			o: { size: 'Mărime', extra: 'Toppinguri extra', sauce: 'Sos', dressing: 'Dressing', remarks: 'Observații' },
			v: { s32: '32 cm', s42: '42 cm', mush: 'Ciuperci', olives: 'Măsline', ham: 'Șuncă', garlic: 'Usturoi', spicy: 'Picant', side: 'Separat', crispy: 'Foarte crocanți', ice: 'Fără gheață' },
			notes: ['Fără ceapă, vă rog.', 'Alergie: fără nuci, vă rog.', '', 'Tăiați pizza în 8 felii.', '']
		}
	}[lang];
	var STATION = { diavola: 'pizza', margherita: 'pizza', quattro: 'pizza', caesar: 'kitchen', lasagna: 'kitchen', fries: 'kitchen', tiramisu: 'kitchen', cola: 'bar', lemonade: 'bar' };

	function item(key, qty, opts) {
		return { name: T.p[key], qty: qty, options: (opts || []).map(function (o) { return { label: T.o[o[0]], value: o[1] }; }), stations: [STATION[key]] };
	}
	var TEMPLATES = [
		function () { return [item('quattro', 1, [['size', T.v.s42], ['extra', T.v.ham]]), item('fries', 1, [['remarks', T.v.crispy]]), item('lemonade', 2, [['remarks', T.v.ice]])]; },
		function () { return [item('diavola', 2, [['size', T.v.s32], ['sauce', T.v.spicy]]), item('cola', 2)]; },
		function () { return [item('margherita', 1, [['size', T.v.s32], ['extra', T.v.mush + ', ' + T.v.olives]]), item('tiramisu', 1)]; },
		function () { return [item('caesar', 1, [['dressing', T.v.side]]), item('lasagna', 1)]; }
	];
	var store, next, tpl;
	function now() { return Math.floor(Date.now() / 1000); }
	function seed() {
		var t = now();
		next = 105; tpl = 0;
		store = [
			{ id: 101, number: '101', created: t - 360, state: 'new', started: 0, ready: 0, editable: true, note: T.notes[0], items: [item('diavola', 1, [['size', T.v.s32], ['extra', T.v.mush + ', ' + T.v.olives]]), item('cola', 1)] },
			{ id: 102, number: '102', created: t - 540, state: 'preparing', started: t - 260, ready: 0, editable: true, note: T.notes[2], items: [item('margherita', 2, [['size', T.v.s42]]), item('caesar', 1, [['dressing', T.v.side]])] },
			{ id: 104, number: '104', created: t - 120, state: 'new', started: 0, ready: 0, editable: true, note: T.notes[3], items: [item('quattro', 1, [['size', T.v.s32], ['sauce', T.v.garlic]]), item('fries', 2)] },
			{ id: 103, number: '103', created: t - 1500, state: 'ready', started: t - 1320, ready: t - 700, editable: true, note: T.notes[1], items: [item('lasagna', 1), item('lemonade', 2, [['remarks', T.v.ice]])] },
			{ id: 98, number: '98', created: t - 2 * 86400 - 3000, state: 'ready', started: t - 2 * 86400 - 2700, ready: t - 2 * 86400 - 1800, editable: false, note: '', items: [item('margherita', 1, [['size', T.v.s32]]), item('tiramisu', 2)] }
		];
	}
	seed();

	function visible() {
		var t = now();
		return store.filter(function (o) {
			if (mode === 'lite') { return o.editable && (o.state !== 'ready' || o.ready >= t - 86400); }
			return o.state === 'ready' ? o.ready >= t - 7 * 86400 : o.editable;
		}).map(function (o) {
			var c = JSON.parse(JSON.stringify(o));
			if (mode === 'lite') { c.items.forEach(function (i) { delete i.stations; }); }
			return c;
		});
	}
	function reply(status, body) {
		return Promise.resolve(new Response(JSON.stringify(body), { status: status, headers: { 'Content-Type': 'application/json' } }));
	}
	var realFetch = window.fetch.bind(window);
	window.fetch = function (url, opts) {
		if (url !== 'demo:ajax') { return realFetch(url, opts); }
		var p = new URLSearchParams(opts && opts.body ? opts.body.toString() : '');
		if (p.get('action') === 'ceacliu_kitchen_orders') { return reply(200, { success: true, data: { orders: visible(), time: now() } }); }
		if (p.get('action') === 'ceacliu_kitchen_transition') {
			var prev = { preparing: 'new', ready: 'preparing' };
			var to = p.get('next');
			var o = store.filter(function (x) { return String(x.id) === p.get('order_id'); })[0];
			if (!o || !prev[to] || !o.editable) { return reply(409, { success: false }); }
			if (o.state === to) { return reply(200, { success: true }); }
			if (o.state !== prev[to]) { return reply(409, { success: false }); }
			o.state = to;
			o[to === 'preparing' ? 'started' : 'ready'] = now();
			return reply(200, { success: true });
		}
		return reply(400, { success: false });
	};

	window.ceacliuKitchen = { ajax: 'demo:ajax', nonce: 'demo', interval: 2000, labels: T.labels, full: mode === 'full', stations: T.stations };

	document.querySelectorAll('[data-t]').forEach(function (el) { el.textContent = T[el.getAttribute('data-t')]; });
	document.querySelector('[data-t-mode]').textContent = T[mode];
	document.title = T.title + ' demo · Ceacliu Studios';
	document.querySelectorAll('[data-mode]').forEach(function (b) {
		b.setAttribute('aria-pressed', String(b.dataset.mode === mode));
		b.addEventListener('click', function () { if (b.dataset.mode !== mode) { location.hash = b.dataset.mode + '-' + lang; location.reload(); } });
	});
	document.querySelectorAll('[data-lang]').forEach(function (b) {
		b.setAttribute('aria-pressed', String(b.dataset.lang === lang));
		b.addEventListener('click', function () { if (b.dataset.lang !== lang) { location.hash = mode + '-' + b.dataset.lang; location.reload(); } });
	});
	document.getElementById('demo-add').addEventListener('click', function () {
		var t = now();
		store.push({ id: next, number: String(next), created: t, state: 'new', started: 0, ready: 0, editable: true, note: T.notes[next % T.notes.length], items: TEMPLATES[tpl % TEMPLATES.length]() });
		next++; tpl++;
	});
	document.getElementById('demo-reset').addEventListener('click', seed);
})();

if (window.CK_DEMO.mode === "full") {
(() => {
	window.ceacliuKitchenFull = {
		init({ config, controls, element, render }) {
			const labels = config.labels;
			const station = element('select', 'ck-select');
			station.setAttribute('aria-label', labels.station);
			for (const [value, name] of Object.entries({ all: labels.all, ...config.stations })) {
				const option = element('option', '', name);
				option.value = value;
				station.append(option);
			}
			const stationKey = 'ceacliu-kitchen-station:' + location.pathname;
			try {
				const saved = sessionStorage.getItem(stationKey);
				if (saved && Object.hasOwn(config.stations, saved)) station.value = saved;
			} catch {}
			station.addEventListener('change', () => {
				try { sessionStorage.setItem(stationKey, station.value); } catch {}
				render();
			});

			const historyButton = element('button', 'ck-button', labels.history);
			const soundButton = element('button', 'ck-button', labels.soundOn);
			historyButton.type = soundButton.type = 'button';
			let history = false;
			let sound = false;
			let context;
			let seen = null;
			let clockOffset = 0;
			controls.append(station, historyButton, soundButton);

			historyButton.addEventListener('click', () => {
				history = !history;
				historyButton.textContent = history ? labels.live : labels.history;
				render();
			});

			function beep() {
				if (context?.state !== 'running') return;
				const wave = context.createOscillator();
				const volume = context.createGain();
				const now = context.currentTime;
				wave.frequency.value = 660;
				volume.gain.setValueAtTime(0.13, now);
				volume.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
				wave.connect(volume).connect(context.destination);
				wave.start(now);
				wave.stop(now + 0.3);
			}

			soundButton.addEventListener('click', async () => {
				if (sound) {
					sound = false;
					soundButton.textContent = labels.soundOn;
					return;
				}
				if (!window.AudioContext) return;
				try {
					context ??= new AudioContext();
					await context.resume();
					sound = context.state === 'running';
					if (sound) {
						soundButton.textContent = labels.soundOff;
						beep();
					}
				} catch {
					sound = false;
				}
			});

			function itemsFor(order) {
				return station.value === 'all' ? order.items : order.items.filter((item) => item.stations.includes(station.value));
			}

			function tick() {
				for (const timer of document.querySelectorAll('#ck-board [data-ck-start]')) {
					const end = Number(timer.dataset.ckEnd) || Date.now() / 1000 + clockOffset;
					const elapsed = Math.max(0, Math.floor(end - Number(timer.dataset.ckStart)));
					const minutes = Math.floor(elapsed / 60);
					timer.textContent = labels.elapsed + ' ' + minutes + ':' + String(elapsed % 60).padStart(2, '0');
				}
			}
			window.setInterval(tick, 1000);

			return {
				fresh(orders, serverTime) {
					clockOffset = serverTime - Date.now() / 1000;
					const live = orders.filter((order) => order.state !== 'ready');
					if (sound && seen && live.some((order) => !seen.has(order.id) && itemsFor(order).length)) beep();
					seen = new Set(live.map((order) => order.id));
				},
				view(orders) {
					const now = Date.now() / 1000 + clockOffset;
					return {
						columns: history ? ['ready'] : ['new', 'preparing', 'ready'],
						orders: orders
							.filter((order) => history ? order.state === 'ready' : order.editable && (order.state !== 'ready' || now - order.ready <= 86400))
							.map((order) => ({ ...order, items: itemsFor(order) }))
							.filter((order) => order.items.length),
					};
				},
				decorate(ticket, order) {
					if (!order.started) return;
					const timer = element('p', 'ck-timer');
					timer.dataset.ckStart = order.started;
					timer.dataset.ckEnd = order.ready;
					ticket.append(timer);
					queueMicrotask(tick);
				},
			};
		},
	};
})();
}
(() => {
	const config = window.ceacliuKitchen;
	const labels = config.labels;
	const columns = ['new', 'preparing', 'ready'];
	const actions = { new: ['preparing', labels.start], preparing: ['ready', labels.finish] };

	function element(tag, className, value) {
		const node = document.createElement(tag);
		if (className) node.className = className;
		if (value !== undefined) node.textContent = value;
		return node;
	}

	async function request(action, fields = {}) {
		const controller = new AbortController();
		const timeout = window.setTimeout(() => controller.abort(), 12000);
		try {
			const response = await fetch(config.ajax, {
				method: 'POST',
				credentials: 'same-origin',
				cache: 'no-store',
				signal: controller.signal,
				body: new URLSearchParams({ action, nonce: config.nonce, ...fields }),
			});
			const result = await response.json().catch(() => null);
			if (!response.ok || !result?.success) {
				throw Object.assign(new Error('Kitchen request failed'), {
					status: result === 0 || result === -1 ? 403 : response.status,
				});
			}
			return result.data;
		} finally {
			window.clearTimeout(timeout);
		}
	}

	function init() {
		const root = document.getElementById('ceacliu-kitchen');
		const board = document.getElementById('ck-board');
		const status = document.getElementById('ck-status');
		if (!root || !board) return;

		const controls = document.getElementById('ck-controls');
		const full = window.ceacliuKitchenFull?.init({ config, element, controls, render });
		if (document.fullscreenEnabled) {
			const button = element('button', 'ck-button', labels.fullscreen);
			button.type = 'button';
			button.addEventListener('click', () => {
				const change = document.fullscreenElement ? document.exitFullscreen() : root.requestFullscreen();
				change.catch(() => {});
			});
			document.addEventListener('fullscreenchange', () => {
				button.textContent = document.fullscreenElement ? labels.exitFull : labels.fullscreen;
			});
			controls.append(button);
		}
		const time = new Intl.DateTimeFormat(undefined, { hour: '2-digit', minute: '2-digit' });
		let orders = [];
		let busy = false;
		let refreshTask;
		let offline = true;
		let fingerprint = '';

		function card(order) {
			const ticket = element('article', 'ck-ticket');
			const heading = element('header', 'ck-ticket-heading');
			heading.append(element('h3', '', labels.order + ' #' + order.number));
			if (order.created) {
				heading.append(element('span', 'ck-time', time.format(order.created * 1000)));
			}
			ticket.append(heading);
			const lineItems = element('ul', 'ck-items');
			for (const item of order.items) {
				const line = element('li', 'ck-item');
				line.append(element('strong', '', item.qty + ' × ' + item.name));
				for (const option of item.options) {
					line.append(element('div', 'ck-option', option.label + ': ' + option.value));
				}
				lineItems.append(line);
			}
			ticket.append(lineItems);
			if (order.note) ticket.append(element('p', 'ck-note', order.note));
			full?.decorate(ticket, order);

			const action = actions[order.state];
			if (action && order.editable) {
				const button = element('button', 'ck-button ck-action', action[1]);
				button.type = 'button';
				button.dataset.order = order.id;
				button.disabled = offline || busy;
				button.addEventListener('click', () => transition(order.id, action[0]));
				ticket.append(button);
			}
			return ticket;
		}

		function render() {
			const currentButton = board.contains(document.activeElement) ? document.activeElement.dataset.order : null;
			const view = full?.view(orders) ?? {
				columns,
				orders: orders.filter((order) => order.state !== 'ready' || Date.now() / 1000 - order.ready <= 86400),
			};
			board.classList.toggle('ck-history', view.columns.length === 1);
			const fragment = document.createDocumentFragment();
			for (const state of view.columns) {
				const column = element('section', 'ck-column ck-' + state);
				const selected = view.orders.filter((order) => order.state === state);
				selected.sort((a, b) => state === 'ready' ? b.ready - a.ready : a.created - b.created);
				column.append(element('h2', '', labels[state] + ' · ' + selected.length));
				if (!selected.length) column.append(element('p', 'ck-empty', labels.empty));
				for (const order of selected) column.append(card(order));
				fragment.append(column);
			}
			board.replaceChildren(fragment);
			if (currentButton) board.querySelector('[data-order="' + currentButton + '"]')?.focus({ preventScroll: true });
			board.setAttribute('aria-busy', 'false');
		}

		function show(message, isError = false) {
			status.textContent = message;
			status.classList.toggle('ck-error', isError);
		}

		async function refresh() {
			try {
				const data = await request('ceacliu_kitchen_orders');
				full?.fresh(data.orders, data.time);
				const serialized = JSON.stringify(data.orders);
				const redraw = offline || serialized !== fingerprint;
				offline = false;
				orders = data.orders;
				fingerprint = serialized;
				if (redraw) render();
				show(labels.connected + ' ' + time.format(Date.now()));
			} catch (error) {
				offline = true;
				render();
				show(error.status === 403 ? labels.expired : labels.error, true);
			}
		}

		async function transition(id, next) {
			if (busy || offline) return;
			busy = true;
			render();
			try {
				await refreshTask;
				if (offline) return;
				await request('ceacliu_kitchen_transition', { order_id: id, next });
				await refresh();
			} catch (error) {
				await refresh();
				const message = error.status === 409 ? labels.conflict : labels.saveError;
				show(error.status === 403 ? labels.expired : message, true);
			} finally {
				busy = false;
				render();
			}
		}

		async function poll() {
			if (!busy) {
				refreshTask = refresh();
				await refreshTask;
				refreshTask = undefined;
			}
			window.setTimeout(poll, config.interval);
		}

		poll();
	}

	if (document.readyState === 'loading') {
		document.addEventListener('DOMContentLoaded', init, { once: true });
	} else {
		init();
	}
})();


</script>
</body>
</html>
